name: Update ImGui framework

on:
  push:
    branches:
      - revival-v2-cleanup
    paths:
      - .github/workflows/update-imgui.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: revival-v2-imgui-update
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout revival branch
        uses: actions/checkout@v4
        with:
          ref: revival-v2-cleanup
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Update Dear ImGui and ImGui-SFML
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'dependencies/imgui-sfml/include'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          $imguiCommit = 'f5befd2d29e66809cd1110a152e375a7f1981f06' # v1.91.9b
          $imguiFiles = @(
            'imgui.cpp',
            'imgui.h',
            'imgui_demo.cpp',
            'imgui_draw.cpp',
            'imgui_internal.h',
            'imgui_tables.cpp',
            'imgui_widgets.cpp',
            'imstb_rectpack.h',
            'imstb_textedit.h',
            'imstb_truetype.h'
          )

          foreach ($file in $imguiFiles) {
            $url = "https://raw.githubusercontent.com/ocornut/imgui/$imguiCommit/$file"
            curl.exe --fail --location --silent --show-error $url --output "$dest/$file"
            if ($LASTEXITCODE -ne 0) { throw "Failed to download $file" }
          }

          $sfmlCommit = '64e09feda29266572799e5ded66eac5cb0a749aa' # ImGui-SFML 2.6.x
          $sfmlFiles = @(
            'imgui-SFML.cpp',
            'imgui-SFML.h',
            'imgui-SFML_export.h',
            'imconfig-SFML.h'
          )

          foreach ($file in $sfmlFiles) {
            $url = "https://raw.githubusercontent.com/SFML/imgui-sfml/$sfmlCommit/$file"
            curl.exe --fail --location --silent --show-error $url --output "$dest/$file"
            if ($LASTEXITCODE -ne 0) { throw "Failed to download $file" }
          }

          if (-not (Select-String -Path "$dest/imgui.h" -Pattern '#define IMGUI_VERSION\s+"1\.91\.9b"' -Quiet)) {
            throw 'Dear ImGui version verification failed.'
          }

          $debugProps = 'dependencies/imgui-sfml/Debug-x64-static-config.props'
          $releaseProps = 'dependencies/imgui-sfml/Release-x64-static-config.props'
          foreach ($props in @($debugProps, $releaseProps)) {
            $text = Get-Content -Raw -Path $props
            $text = $text.Replace(';ImGui-SFML-d.lib', '')
            $text = $text.Replace(';ImGui-SFML.lib', '')
            [System.IO.File]::WriteAllText((Resolve-Path $props), $text, [System.Text.UTF8Encoding]::new($false))
          }

      - name: Build Release x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild '.\ImGui Advanced Cheat Menu.vcxproj' /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with exit code $LASTEXITCODE" }

      - name: Commit framework update
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          Remove-Item '.github/workflows/update-imgui.yml'

          git add -- `
            dependencies/imgui-sfml/include/imgui.cpp `
            dependencies/imgui-sfml/include/imgui.h `
            dependencies/imgui-sfml/include/imgui_demo.cpp `
            dependencies/imgui-sfml/include/imgui_draw.cpp `
            dependencies/imgui-sfml/include/imgui_internal.h `
            dependencies/imgui-sfml/include/imgui_tables.cpp `
            dependencies/imgui-sfml/include/imgui_widgets.cpp `
            dependencies/imgui-sfml/include/imstb_rectpack.h `
            dependencies/imgui-sfml/include/imstb_textedit.h `
            dependencies/imgui-sfml/include/imstb_truetype.h `
            dependencies/imgui-sfml/include/imgui-SFML.cpp `
            dependencies/imgui-sfml/include/imgui-SFML.h `
            dependencies/imgui-sfml/include/imgui-SFML_export.h `
            dependencies/imgui-sfml/include/imconfig-SFML.h `
            dependencies/imgui-sfml/Debug-x64-static-config.props `
            dependencies/imgui-sfml/Release-x64-static-config.props `
            .github/workflows/update-imgui.yml

          if (git diff --cached --quiet) {
            Write-Host 'No framework changes to commit.'
            exit 0
          }

          git commit -m 'Update Dear ImGui to 1.91.9b'
          git push origin HEAD:revival-v2-cleanup
