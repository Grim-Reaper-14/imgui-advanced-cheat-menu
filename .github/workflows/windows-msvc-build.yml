name: Windows MSVC Build

on:
  push:
    branches:
      - revival-v2-cleanup
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  build-release-x64:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Vendor scripting dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $needsSol2 = -not (Test-Path 'dependencies/sol2/include/sol/sol.hpp')
          $needsLua = -not (Test-Path 'dependencies/lua/lua.h')

          if (-not $needsSol2 -and -not $needsLua) {
            Write-Host 'Sol2 and Lua are already vendored.'
            exit 0
          }

          $temp = Join-Path $env:RUNNER_TEMP 'revival-script-deps'
          New-Item -ItemType Directory -Force $temp | Out-Null

          if ($needsSol2) {
            git clone --depth 1 --branch v3.3.1 https://github.com/ThePhD/sol2.git (Join-Path $temp 'sol2')
            New-Item -ItemType Directory -Force 'dependencies/sol2/include' | Out-Null
            Copy-Item (Join-Path $temp 'sol2/include/sol') 'dependencies/sol2/include/' -Recurse -Force
          }

          if ($needsLua) {
            git clone --depth 1 --branch v5.4.8 https://github.com/lua/lua.git (Join-Path $temp 'lua')
            New-Item -ItemType Directory -Force 'dependencies/lua' | Out-Null
            Copy-Item (Join-Path $temp 'lua/*.h') 'dependencies/lua/' -Force
            Copy-Item (Join-Path $temp 'lua/*.c') 'dependencies/lua/' -Force
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ($needsSol2) { git add -- dependencies/sol2 }
          if ($needsLua) { git add -- dependencies/lua }
          git commit -m 'Vendor Sol2 v3.3.1 and Lua 5.4.8'
          git push origin HEAD:revival-v2-cleanup

      - name: Restore and validate Revival header artwork
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @(
            'resources/RevivalHeaderPart00.inc',
            'resources/RevivalHeaderPart01.inc',
            'resources/RevivalHeaderPart02.inc',
            'resources/RevivalHeaderRest00.inc',
            'resources/RevivalHeaderRest01.inc',
            'resources/RevivalHeaderRest02.inc',
            'resources/RevivalHeaderRest03.inc',
            'resources/RevivalHeaderRest04a.inc',
            'resources/RevivalHeaderRest04b.inc',
            'resources/RevivalHeaderRest05a.inc',
            'resources/RevivalHeaderRest05b.inc',
            'resources/RevivalHeaderRest06.inc',
            'resources/RevivalHeaderRest07.inc',
            'resources/RevivalHeaderRest08.inc',
            'resources/RevivalHeaderRest09a.inc',
            'resources/RevivalHeaderRest09b.inc',
            'resources/RevivalHeaderRest10a.inc',
            'resources/RevivalHeaderRest10b.inc',
            'resources/RevivalHeaderRest11a.inc',
            'resources/RevivalHeaderRest11b.inc'
          )

          $prefix = 'R"REVIVAL('
          $suffix = ')REVIVAL",'
          $encoded = ''

          foreach ($part in $parts) {
            if (-not (Test-Path $part)) {
              throw "Missing embedded header chunk: $part"
            }

            $text = (Get-Content -Raw $part).Trim()
            if (-not $text.StartsWith($prefix) -or -not $text.EndsWith($suffix)) {
              throw "Malformed embedded header chunk: $part"
            }

            $payloadLength = $text.Length - $prefix.Length - $suffix.Length
            $encoded += $text.Substring($prefix.Length, $payloadLength)
          }

          $bytes = [Convert]::FromBase64String($encoded)
          $headerPath = 'assets/icons/revival_header.jpg'
          [IO.File]::WriteAllBytes($headerPath, $bytes)

          $expectedSha256 = 'bf46af083e5b3132e5c75d58f1a97537efd3617132a0e816e0003768137b0a9d'
          $actualSha256 = (Get-FileHash $headerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Reconstructed Revival header hash mismatch. Expected $expectedSha256 but got $actualSha256"
          }

          Add-Type -AssemblyName System.Drawing
          $image = [System.Drawing.Image]::FromFile((Resolve-Path $headerPath))
          try {
            if ($image.Width -ne 1200 -or $image.Height -ne 400) {
              throw "Wrong Revival header dimensions: $($image.Width)x$($image.Height)"
            }
            Write-Host "Verified Revival header: $($image.Width)x$($image.Height), SHA256 $actualSha256"
          }
          finally {
            $image.Dispose()
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $headerPath
          git diff --cached --quiet -- $headerPath
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Repair Revival header artwork from verified source'
            git push origin HEAD:revival-v2-cleanup
          } else {
            Write-Host 'Physical header file already matches verified embedded source.'
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        id: build
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'msbuild.log'
          & msbuild '.\ImGui Advanced Cheat Menu.vcxproj' /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal 2>&1 | Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          $state = if ($exitCode -eq 0) { 'success' } else { 'failure' }
          "state=$state" >> $env:GITHUB_OUTPUT
          "exit_code=$exitCode" >> $env:GITHUB_OUTPUT
          Write-Host "MSBuild exit code: $exitCode"

      - name: Publish commit status
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_STATE: ${{ steps.build.outputs.state }}
        run: |
          $state = if ($env:BUILD_STATE) { $env:BUILD_STATE } else { 'failure' }
          $buildSha = (git rev-parse HEAD).Trim()
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/statuses/$buildSha" -f state="$state" -f context='Windows MSVC Build' -f description="Release x64 MSVC build: $state"

      - name: Publish build log
        if: always()
        shell: pwsh
        env:
          BUILD_STATE: ${{ steps.build.outputs.state }}
          BUILD_EXIT_CODE: ${{ steps.build.outputs.exit_code }}
        run: |
          $state = if ($env:BUILD_STATE) { $env:BUILD_STATE } else { 'failure' }
          $exitCode = if ($env:BUILD_EXIT_CODE) { $env:BUILD_EXIT_CODE } else { '-1' }
          $buildSha = (git rev-parse HEAD).Trim()
          $resultDir = Join-Path $env:RUNNER_TEMP 'ci-build-results'

          git fetch origin ci-build-results 2>$null
          if ($LASTEXITCODE -eq 0) {
            git worktree add -B ci-build-results $resultDir origin/ci-build-results
          } else {
            git worktree add --detach $resultDir
            git -C $resultDir switch --orphan ci-build-results
          }

          Copy-Item (Join-Path $env:RUNNER_TEMP 'msbuild.log') (Join-Path $resultDir 'latest.log') -Force
          [ordered]@{
            source_sha = $buildSha
            state = $state
            exit_code = [int]$exitCode
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            runner = $env:RUNNER_NAME
            completed_utc = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json | Set-Content (Join-Path $resultDir 'status.json')

          git -C $resultDir config user.name 'github-actions[bot]'
          git -C $resultDir config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C $resultDir add -- latest.log status.json
          git -C $resultDir commit -m "ci: record Windows MSVC build for $buildSha"
          git -C $resultDir push origin HEAD:ci-build-results --force

      - name: Fail job when MSBuild fails
        if: steps.build.outputs.state != 'success'
        shell: pwsh
        run: exit 1
