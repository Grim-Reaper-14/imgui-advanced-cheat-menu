name: Windows MSVC Build

on:
  push:
    branches:
      - revival-v2-cleanup
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  build-release-x64:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Vendor pinned UI dependencies
        if: hashFiles('.gitmodules') != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $temp = Join-Path $env:RUNNER_TEMP 'vendored-ui'
          New-Item -ItemType Directory -Force (Join-Path $temp 'imgui') | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $temp 'imgui-sfml-src') | Out-Null

          $imguiFiles = @(
            'imconfig.h',
            'imgui.h',
            'imgui_internal.h',
            'imgui.cpp',
            'imgui_demo.cpp',
            'imgui_draw.cpp',
            'imgui_tables.cpp',
            'imgui_widgets.cpp',
            'imstb_rectpack.h',
            'imstb_textedit.h',
            'imstb_truetype.h'
          )

          $sfmlFiles = @(
            'imconfig-SFML.h',
            'imgui-SFML.h',
            'imgui-SFML_export.h',
            'imgui-SFML.cpp'
          )

          foreach ($file in $imguiFiles) {
            Copy-Item (Join-Path 'dependencies/imgui' $file) (Join-Path $temp 'imgui' $file) -Force
          }
          foreach ($file in $sfmlFiles) {
            Copy-Item (Join-Path 'dependencies/imgui-sfml-src' $file) (Join-Path $temp 'imgui-sfml-src' $file) -Force
          }

          git rm -f --cached -- dependencies/imgui dependencies/imgui-sfml-src
          Remove-Item -Recurse -Force dependencies/imgui, dependencies/imgui-sfml-src
          git rm -f -- .gitmodules

          New-Item -ItemType Directory -Force dependencies/imgui | Out-Null
          New-Item -ItemType Directory -Force dependencies/imgui-sfml-src | Out-Null
          Copy-Item (Join-Path $temp 'imgui/*') dependencies/imgui/ -Force
          Copy-Item (Join-Path $temp 'imgui-sfml-src/*') dependencies/imgui-sfml-src/ -Force

          git add -- dependencies/imgui dependencies/imgui-sfml-src
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Vendor Dear ImGui and ImGui-SFML sources'
          git push origin HEAD:revival-v2-cleanup

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        id: build
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'msbuild.log'
          & msbuild '.\ImGui Advanced Cheat Menu.vcxproj' /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal 2>&1 | Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          $state = if ($exitCode -eq 0) { 'success' } else { 'failure' }
          "state=$state" >> $env:GITHUB_OUTPUT
          "exit_code=$exitCode" >> $env:GITHUB_OUTPUT
          Write-Host "MSBuild exit code: $exitCode"

      - name: Publish commit status
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_STATE: ${{ steps.build.outputs.state }}
        run: |
          $state = if ($env:BUILD_STATE) { $env:BUILD_STATE } else { 'failure' }
          $buildSha = (git rev-parse HEAD).Trim()
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/statuses/$buildSha" -f state="$state" -f context='Windows MSVC Build' -f description="Release x64 MSVC build: $state"

      - name: Publish build log
        if: always()
        shell: pwsh
        env:
          BUILD_STATE: ${{ steps.build.outputs.state }}
          BUILD_EXIT_CODE: ${{ steps.build.outputs.exit_code }}
        run: |
          $state = if ($env:BUILD_STATE) { $env:BUILD_STATE } else { 'failure' }
          $exitCode = if ($env:BUILD_EXIT_CODE) { $env:BUILD_EXIT_CODE } else { '-1' }
          $buildSha = (git rev-parse HEAD).Trim()
          $resultDir = Join-Path $env:RUNNER_TEMP 'ci-build-results'

          git fetch origin ci-build-results 2>$null
          if ($LASTEXITCODE -eq 0) {
            git worktree add -B ci-build-results $resultDir origin/ci-build-results
          } else {
            git worktree add --detach $resultDir
            git -C $resultDir switch --orphan ci-build-results
          }

          Copy-Item (Join-Path $env:RUNNER_TEMP 'msbuild.log') (Join-Path $resultDir 'latest.log') -Force
          [ordered]@{
            source_sha = $buildSha
            state = $state
            exit_code = [int]$exitCode
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            runner = $env:RUNNER_NAME
            completed_utc = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json | Set-Content (Join-Path $resultDir 'status.json')

          git -C $resultDir config user.name 'github-actions[bot]'
          git -C $resultDir config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C $resultDir add -- latest.log status.json
          git -C $resultDir commit -m "ci: record Windows MSVC build for $buildSha"
          git -C $resultDir push origin HEAD:ci-build-results --force

      - name: Fail job when MSBuild fails
        if: steps.build.outputs.state != 'success'
        shell: pwsh
        run: exit 1
